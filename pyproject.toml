[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling tool using constrained decoding with a small LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "llm-sdk",
    "numpy",
    "pydantic",
]

[tool.uv.sources]
llm-sdk = { path = "./llm_sdk" }

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.1.0",
]
